<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="64" height="96" shape-rendering="crispEdges">
  <!-- Hair & Head -->
  <rect x="10" y="3" width="12" height="4" fill="#3e2723" />
  <rect x="8" y="5" width="16" height="4" fill="#3e2723" />
  <rect x="8" y="9" width="4" height="5" fill="#3e2723" />
  <rect x="20" y="9" width="4" height="4" fill="#3e2723" />
  <rect x="10" y="9" width="12" height="6" fill="#f8d7da" />
  <!-- Glasses -->
  <rect x="10" y="10" width="5" height="3" fill="#18181b" />
  <rect x="17" y="10" width="5" height="3" fill="#18181b" />
  <rect x="15" y="11" width="2" height="1" fill="#18181b" />
  <!-- Beard -->
  <rect x="11" y="15" width="10" height="2" fill="#3e2723" />
  <rect x="13" y="14" width="6" height="1" fill="#ffffff" />
  <!-- Shirt -->
  <rect x="8" y="18" width="16" height="13" fill="#3b82f6" />
  <rect x="15" y="18" width="2" height="12" fill="#1d4ed8" />
  <!-- Arms swinging opposite -->
  <rect x="5" y="22" width="4" height="6" fill="#2563eb" />
  <rect x="5" y="28" width="3" height="3" fill="#f8d7da" />
  <rect x="23" y="20" width="4" height="6" fill="#2563eb" />
  <rect x="24" y="26" width="3" height="3" fill="#f8d7da" />
  <!-- Right leg forward, Left leg back -->
  <rect x="10" y="31" width="5" height="8" fill="#1f2937" />
  <rect x="17" y="31" width="6" height="10" fill="#374151" />
  <!-- Shoes -->
  <rect x="9" y="39" width="6" height="3" fill="#5b2807" />
  <rect x="17" y="41" width="8" height="4" fill="#78350f" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="64" height="96" shape-rendering="crispEdges">
  <!-- Hair & Head -->
  <rect x="10" y="4" width="12" height="4" fill="#3e2723" />
  <rect x="8" y="6" width="16" height="4" fill="#3e2723" />
  <rect x="8" y="10" width="4" height="5" fill="#3e2723" />
  <rect x="20" y="10" width="4" height="4" fill="#3e2723" />
  <rect x="10" y="10" width="12" height="6" fill="#f8d7da" />
  <!-- Glasses -->
  <rect x="10" y="11" width="5" height="3" fill="#18181b" />
  <rect x="17" y="11" width="5" height="3" fill="#18181b" />
  <rect x="15" y="12" width="2" height="1" fill="#18181b" />
  <!-- Beard -->
  <rect x="11" y="16" width="10" height="2" fill="#3e2723" />
  <rect x="13" y="15" width="6" height="1" fill="#ffffff" />
  <!-- Shirt -->
  <rect x="8" y="19" width="16" height="13" fill="#3b82f6" />
  <rect x="15" y="19" width="2" height="12" fill="#1d4ed8" />
  <!-- Arms swinging in stride -->
  <rect x="5" y="21" width="4" height="6" fill="#2563eb" />
  <rect x="5" y="27" width="3" height="3" fill="#f8d7da" />
  <rect x="23" y="23" width="4" height="6" fill="#2563eb" />
  <rect x="24" y="29" width="3" height="3" fill="#f8d7da" />
  <!-- Left leg forward, Right leg back -->
  <rect x="8" y="32" width="6" height="9" fill="#374151" />
  <rect x="18" y="32" width="6" height="8" fill="#1f2937" />
  <!-- Shoes -->
  <rect x="6" y="41" width="8" height="4" fill="#78350f" />
  <rect x="19" y="40" width="6" height="3" fill="#5b2807" />
</svg>

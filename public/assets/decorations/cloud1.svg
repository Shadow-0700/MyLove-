<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <defs>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.85" />
    </linearGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <path d="M50 140 A45 45 0 0 1 70 65 A60 60 0 0 1 170 50 A65 65 0 0 1 245 90 A45 45 0 0 1 260 140 Z" fill="url(#cloudGrad)"/>
    <!-- Subtle dreamy sparkles inside cloud -->
    <circle cx="95" cy="85" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="160" cy="75" r="4" fill="#fbbf24" opacity="0.7"/>
    <circle cx="215" cy="105" r="3" fill="#fbbf24" opacity="0.5"/>
  </g>
</svg>

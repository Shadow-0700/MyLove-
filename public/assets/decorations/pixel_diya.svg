<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <filter id="diyaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Flame with glow -->
  <g filter="url(#diyaGlow)">
    <!-- Outer orange/red flame -->
    <rect x="15" y="4" width="2" height="3" fill="#ef4444" />
    <rect x="14" y="7" width="4" height="4" fill="#f97316" />
    <rect x="13" y="11" width="6" height="5" fill="#f59e0b" />
    <!-- Inner bright yellow flame -->
    <rect x="15" y="8" width="2" height="6" fill="#fde047" />
    <rect x="15" y="10" width="2" height="3" fill="#ffffff" />
  </g>
  <!-- Clay Diya Base (terracotta earthen bowl) -->
  <rect x="10" y="16" width="12" height="2" fill="#78350f" />
  <rect x="7" y="18" width="18" height="3" fill="#b45309" />
  <rect x="5" y="21" width="22" height="3" fill="#d97706" />
  <rect x="7" y="24" width="18" height="3" fill="#b45309" />
  <rect x="10" y="27" width="12" height="2" fill="#78350f" />
  <!-- Diya rim highlights -->
  <rect x="8" y="18" width="16" height="1" fill="#fde68a" opacity="0.6"/>
  <rect x="6" y="21" width="20" height="1" fill="#f59e0b" opacity="0.8"/>
</svg>
